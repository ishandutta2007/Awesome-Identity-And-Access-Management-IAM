<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glow-purple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield / Lock Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Security Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.03); }
      }
      @keyframes dash-line {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes particle-fade {
        0%, 100% { opacity: 0.2; transform: translateY(0); }
        50% { opacity: 0.8; transform: translateY(-12px); }
      }
      .animated-shield {
        animation: float-slow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-pulse {
        animation: pulse-glow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .dash-flow {
        stroke-dasharray: 8 12;
        animation: dash-line 12s linear infinite;
      }
      .particle-1 { animation: particle-fade 3s ease-in-out infinite; }
      .particle-2 { animation: particle-fade 4.5s ease-in-out infinite 1s; }
      .particle-3 { animation: particle-fade 5s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1200" height="320" fill="url(#bg-grad)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="250" cy="100" r="300" fill="url(#glow-purple)" class="animated-pulse"/>
  <circle cx="950" cy="220" r="250" fill="url(#glow-cyan)" class="animated-pulse"/>

  <!-- 2. Animated Dynamic Cyber Security Nodes & Network (Background Graphics) -->
  <g stroke="#475569" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="100" y1="260" x2="300" y2="280" class="dash-flow"/>
    <line x1="850" y1="60" x2="1050" y2="90" class="dash-flow"/>
    <line x1="920" y1="250" x2="1120" y2="200" class="dash-flow"/>
  </g>

  <!-- Floating Particles -->
  <circle cx="150" cy="220" r="3" fill="#38bdf8" class="particle-1"/>
  <circle cx="280" cy="70" r="4" fill="#818cf8" class="particle-2"/>
  <circle cx="1020" cy="140" r="3.5" fill="#a855f7" class="particle-3"/>
  <circle cx="1100" cy="260" r="3" fill="#06b6d4" class="particle-1"/>

  <!-- 3. Right Foreground Graphic: Isometric Security Shield & Lock Badge -->
  <g transform="translate(970, 160)" class="animated-shield">
    <!-- Outer Glowing Shield Ring -->
    <path d="M 0 -85 L 65 -45 L 65 30 C 65 75 0 100 0 100 C 0 100 -65 75 -65 30 L -65 -45 Z" 
          fill="none" stroke="url(#shield-grad)" stroke-width="3.5" stroke-opacity="0.8"/>
    
    <!-- Shield Fill -->
    <path d="M 0 -75 L 56 -39 L 56 26 C 56 65 0 87 0 87 C 0 87 -56 65 -56 26 L -56 -39 Z" 
          fill="#0f172a" fill-opacity="0.85" stroke="#312e81" stroke-width="2"/>

    <!-- Inner Lock Icon -->
    <rect x="-22" y="-5" width="44" height="36" rx="6" fill="url(#shield-grad)"/>
    <path d="M -14 -5 A 14 14 0 0 1 14 -5" fill="none" stroke="url(#shield-grad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="4" fill="#0f172a"/>
    <polygon points="-2,13 2,13 3,22 -3,22" fill="#0f172a"/>
  </g>

  <!-- 4. Left/Center Main Typography & Metadata (100% Foreground Legibility) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2"/>
      <text x="15" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1">
        🔐 ENTERPRISE SECURITY &amp; IDENTITY
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="36" font-weight="900" fill="url(#text-grad)" letter-spacing="-0.5">
      Awesome Identity &amp; Access Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated Directory of Enterprise SaaS &amp; Open-Source IAM, AuthN, AuthZ &amp; IGA Infrastructure
    </text>

    <!-- Feature Tag Chips -->
    <g transform="translate(0, 200)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="135" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">🛡️ SSO &amp; MFA</text>

      <!-- Chip 2 -->
      <rect x="147" y="0" width="155" height="30" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
      <text x="159" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">🔑 OAuth2 / OIDC</text>

      <!-- Chip 3 -->
      <rect x="314" y="0" width="170" height="30" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="326" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f0abfc">⚡ Zero Trust &amp; PAM</text>

      <!-- Chip 4 -->
      <rect x="496" y="0" width="155" height="30" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
      <text x="508" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">📜 Policy-as-Code</text>
    </g>

    <!-- Update Date Badge -->
    <text x="0" y="265" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      Last Updated: October 2026 • Curated with ❤️ for Security Architects &amp; Developers
    </text>
  </g>
</svg>
